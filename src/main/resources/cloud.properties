# Shared online directory: accounts, campaign memberships, join codes.
# Override per machine in <data folder>\data\auth\cloud.properties, or with -Ddnd.cloud.<key>=...
# Set enabled=false (or run with -Ddnd.cloud=off) to keep everything on this machine only.
enabled=true
databaseUrl=https://dnd-campaign-f8c23-default-rtdb.europe-west1.firebasedatabase.app
rootPath=sessions/dnd-directory

# Firebase Web API key (Firebase console > Project settings > General > Web API key).
# When set, and Email/Password sign-in is enabled under Authentication > Sign-in method,
# verification and password-reset emails are sent by Firebase. Web API keys identify the
# project and are not secret. Leave empty to fall back to SMTP / on-screen codes.
apiKey=
authUrl=https://identitytoolkit.googleapis.com/v1
